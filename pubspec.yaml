name: video_effects_studio
description: >-
  Desktop video effects studio for logo-editing style effects — G-Majors,
  vocoders, glitches, pitch chords — with previews and effect compilations.
publish_to: 'none'
version: 2.0.0-dev.3+5

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.5

  # Files
  path: ^1.9.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  desktop_drop: ^0.8.4

  # Persistence
  shared_preferences: ^2.5.5

  # Playback (before/after preview)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Updates / links
  http: ^1.5.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-ExtraBold.ttf
    - bases/catalog.json
    - bases/transcriptions/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
