name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish: 'auto' = v + the app version in pubspec.yaml (e.g. v2.0.0-dev.1), or type one; empty = build only"
        required: false
        default: 'auto'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  # The store's public key (store/README.md): builds made without it can't
  # be unlocked, so the build stops instead.
  SRLE_LICENSE_PUBLIC_KEY: ${{ vars.SRLE_LICENSE_PUBLIC_KEY }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Latest base library from the public repository
        shell: bash
        run: |
          # Approved transcriptions land in 1ajh/srle-studio: ship the newest.
          if git clone --depth 1 https://github.com/1ajh/srle-studio public-latest && [ -f public-latest/bases/catalog.json ]; then
            cp -R public-latest/bases/. bases/
          fi
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          test -n "$SRLE_LICENSE_PUBLIC_KEY" || { echo "::error::Set the SRLE_LICENSE_PUBLIC_KEY Actions variable (store/README.md)"; exit 1; }
          flutter build windows --release --dart-define=SRLE_LICENSE_PUBLIC_KEY=$SRLE_LICENSE_PUBLIC_KEY

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          $bin = (Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" -Destination build\windows\x64\runner\Release\
          & build\windows\x64\runner\Release\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Package
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md build\windows\x64\runner\Release\
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SRLEStudio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SRLEStudio-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Latest base library from the public repository
        shell: bash
        run: |
          # Approved transcriptions land in 1ajh/srle-studio: ship the newest.
          if git clone --depth 1 https://github.com/1ajh/srle-studio public-latest && [ -f public-latest/bases/catalog.json ]; then
            cp -R public-latest/bases/. bases/
          fi
      - run: flutter pub get
      - name: Build
        run: |
          test -n "$SRLE_LICENSE_PUBLIC_KEY" || { echo "::error::Set the SRLE_LICENSE_PUBLIC_KEY Actions variable (store/README.md)"; exit 1; }
          flutter build linux --release --dart-define=SRLE_LICENSE_PUBLIC_KEY=$SRLE_LICENSE_PUBLIC_KEY

      - name: Bundle FFmpeg
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          mkdir ffmpeg-temp && tar -xf ffmpeg.tar.xz -C ffmpeg-temp --strip-components=1
          install -m 755 ffmpeg-temp/bin/ffmpeg ffmpeg-temp/bin/ffprobe build/linux/x64/release/bundle/
          build/linux/x64/release/bundle/ffmpeg -hide_banner -version | head -1

      - name: Package
        run: |
          cp THIRD_PARTY_NOTICES.md build/linux/x64/release/bundle/
          tar -czf SRLEStudio-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: SRLEStudio-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Latest base library from the public repository
        shell: bash
        run: |
          # Approved transcriptions land in 1ajh/srle-studio: ship the newest.
          if git clone --depth 1 https://github.com/1ajh/srle-studio public-latest && [ -f public-latest/bases/catalog.json ]; then
            cp -R public-latest/bases/. bases/
          fi
      - run: flutter pub get
      - name: Build
        run: |
          test -n "$SRLE_LICENSE_PUBLIC_KEY" || { echo "::error::Set the SRLE_LICENSE_PUBLIC_KEY Actions variable (store/README.md)"; exit 1; }
          flutter build macos --release --dart-define=SRLE_LICENSE_PUBLIC_KEY=$SRLE_LICENSE_PUBLIC_KEY

      - name: Bundle universal FFmpeg
        run: |
          set -e
          mkdir -p ff/arm64 ff/amd64
          for arch in arm64 amd64; do
            for tool in ffmpeg ffprobe; do
              curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip" -o "ff/$arch/$tool.zip"
              unzip -o -q "ff/$arch/$tool.zip" -d "ff/$arch"
            done
          done
          APP="build/macos/Build/Products/Release/SRLE Studio.app"
          for tool in ffmpeg ffprobe; do
            lipo -create -output "$APP/Contents/MacOS/$tool" "ff/arm64/$tool" "ff/amd64/$tool"
            chmod +x "$APP/Contents/MacOS/$tool"
          done
          "$APP/Contents/MacOS/ffmpeg" -hide_banner -version | head -1
          # Re-sign (ad hoc) after adding binaries to the bundle.
          codesign --force --deep --sign - "$APP"

      - name: Package DMG
        run: |
          mkdir dmg
          cp -R "build/macos/Build/Products/Release/SRLE Studio.app" dmg/
          ln -s /Applications dmg/Applications
          cp THIRD_PARTY_NOTICES.md dmg/
          hdiutil create -volname "SRLE Studio" -srcfolder dmg -ov -format UDZO SRLEStudio-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: SRLEStudio-macos.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pubspec.yaml
      - name: Pick the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$INPUT_TAG" == "auto" ]]; then
            tag="v$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          else
            tag="$INPUT_TAG"
          fi
          echo "Publishing $tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the publishing token
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::Add a PUBLIC_REPO_TOKEN secret that can write releases to 1ajh/srle-studio (README.md)"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          # Releases go to the public repository; the code here is private.
          repository: 1ajh/srle-studio
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/windows/SRLEStudio-windows.zip
            artifacts/linux/SRLEStudio-linux.tar.gz
            artifacts/macos/SRLEStudio-macos.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Tags like v2.0.0-dev.1 are test builds: published as pre-releases,
          # which the in-app update check (releases/latest) never offers.
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
