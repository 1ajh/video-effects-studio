name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          $bin = (Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" -Destination build\windows\x64\runner\Release\
          & build\windows\x64\runner\Release\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath VideoEffectsStudio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: VideoEffectsStudio-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Bundle FFmpeg
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          mkdir ffmpeg-temp && tar -xf ffmpeg.tar.xz -C ffmpeg-temp --strip-components=1
          install -m 755 ffmpeg-temp/bin/ffmpeg ffmpeg-temp/bin/ffprobe build/linux/x64/release/bundle/
          build/linux/x64/release/bundle/ffmpeg -hide_banner -version | head -1

      - name: Package
        run: tar -czf VideoEffectsStudio-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: VideoEffectsStudio-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Bundle universal FFmpeg
        run: |
          set -e
          mkdir -p ff/arm64 ff/amd64
          for arch in arm64 amd64; do
            for tool in ffmpeg ffprobe; do
              curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip" -o "ff/$arch/$tool.zip"
              unzip -o -q "ff/$arch/$tool.zip" -d "ff/$arch"
            done
          done
          APP="build/macos/Build/Products/Release/Video Effects Studio.app"
          for tool in ffmpeg ffprobe; do
            lipo -create -output "$APP/Contents/MacOS/$tool" "ff/arm64/$tool" "ff/amd64/$tool"
            chmod +x "$APP/Contents/MacOS/$tool"
          done
          "$APP/Contents/MacOS/ffmpeg" -hide_banner -version | head -1
          # Re-sign (ad hoc) after adding binaries to the bundle.
          codesign --force --deep --sign - "$APP"

      - name: Package DMG
        run: |
          mkdir dmg
          cp -R "build/macos/Build/Products/Release/Video Effects Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Video Effects Studio" -srcfolder dmg -ov -format UDZO VideoEffectsStudio-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: VideoEffectsStudio-macos.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/VideoEffectsStudio-windows.zip
            artifacts/linux/VideoEffectsStudio-linux.tar.gz
            artifacts/macos/VideoEffectsStudio-macos.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
